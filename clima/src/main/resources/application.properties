spring.application.name=clima
server.port=8081

# Configuracion PostgreSQL (ajustar spring.datasource.password segun tu instalacion local)
spring.datasource.url=jdbc:postgresql://localhost:5432/clima
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Alternativa H2 en memoria para laboratorio local (descomentar estas lineas y comentar PostgreSQL si deseas usar H2):
# spring.datasource.url=jdbc:h2:mem:climadb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
